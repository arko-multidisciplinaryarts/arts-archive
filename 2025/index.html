<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여기, 다원예술이 있다 (2025)</title>
<meta name="description" content="2025 다원예술 창작산실·창작주체 담론집. 책처럼 넘겨 보는 온라인판.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 책이 주인공인 한 화면 뷰어: 위 메뉴, 가운데 책, 아래 쪽 이동 */
:root{
  --bg:#E4E5E8; --stage:#DADBDF; --ink:#1C1D20; --muted:#63666C; --panel:#F6F6F7;
  --line:#C9CBCF; --accent:#D03A19; --accent-ink:#fff; --shadow:rgba(20,22,28,.28);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --bar:52px; --foot:60px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17181A; --stage:#101113; --ink:#ECECEE; --muted:#9A9DA3; --panel:#222326;
    --line:#35373B; --accent:#F4775C; --accent-ink:#2A0E07; --shadow:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17181A; --stage:#101113; --ink:#ECECEE; --muted:#9A9DA3; --panel:#222326;
  --line:#35373B; --accent:#F4775C; --accent-ink:#2A0E07; --shadow:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 상단 바 */
.bar{height:var(--bar);flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:5}
.title{min-width:0;flex:1;display:flex;align-items:baseline;gap:12px}
.title h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.title p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);
  display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-only{width:36px;padding:0;justify-content:center}

/* 책 무대 */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--stage);position:relative}
.book-wrap{width:min(100%, calc((100dvh - var(--bar) - var(--foot) - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 0.7 * 2));}
@media (max-width:699px){
  .stage{padding:12px}
  .book-wrap{width:min(100%, calc((100dvh - var(--bar) - var(--foot) - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 0.7));}
  .title p{display:none}
  .hide-sm{display:none}
  .where{min-width:0}
  .foot{gap:10px;padding:0 12px}
}
.page{background:#fff;overflow:hidden}
.page img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.stf__parent{filter:drop-shadow(0 10px 24px var(--shadow))}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}

/* 하단 바 */
.foot{height:var(--foot);flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid var(--line);background:var(--bg)}
.scrub{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.where{font-size:14px;color:var(--muted);min-width:120px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.where b{color:var(--ink);font-weight:600}

/* 목차 서랍 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toc{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--panel);z-index:21;
  transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-right:1px solid var(--line)}
body.toc-open .toc{transform:none}
body.toc-open .scrim{opacity:1;pointer-events:auto}
.toc header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px 20px}
.toc h2{margin:0;font-size:15px;font-weight:600}
.toc ol{list-style:none;margin:0;padding:4px 0 24px;overflow:auto}
.toc li button{width:100%;display:flex;justify-content:space-between;gap:12px;align-items:baseline;border:0;background:none;
  text-align:left;cursor:pointer;padding:10px 20px;font-size:15px;line-height:1.4;border-left:3px solid transparent}
.toc li.sub button{padding:7px 20px 7px 36px;font-size:14px;color:var(--muted)}
.toc li button:hover{background:var(--bg)}
.toc li button .pg{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.toc li.on > button{border-left-color:var(--accent);color:var(--ink);font-weight:600}

/* 크게 보기 */
.zoom{position:fixed;inset:0;background:var(--stage);z-index:30;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.zoom-open .zoom{display:flex}
.zoom .bar{background:var(--bg)}
.zoom-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom-pages{display:flex;gap:4px;justify-content:center;padding:20px;width:max-content;min-width:100%}
.zoom-pages img{width:calc(var(--zw) * 1px);height:auto;display:block;background:#fff;box-shadow:0 6px 20px var(--shadow)}
/* 휴대폰 가로 화면: 메뉴를 얇게 하고 양면으로 펼침 */
@media (orientation:landscape) and (max-height:560px){
  :root{--bar:40px;--foot:44px}
  .bar,.foot{padding:0 10px}
  .btn{height:30px}
  .icon-only{width:30px}
  .title h1{font-size:15px}
  .title p{display:none}
  .stage{padding:6px}
  .book-wrap{width:min(100%, calc((100dvh - var(--bar) - var(--foot) - 12px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 0.7 * 2));}
}
@media (prefers-reduced-motion: reduce){.toc,.scrim{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <button class="btn" id="tocBtn" aria-controls="toc" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>목차
  </button>
  <div class="title"><h1>여기, 다원예술이 있다</h1><p>2025 다원예술 창작산실·창작주체 담론집</p></div>
  <button class="btn" id="zoomBtn" title="크게 보기" aria-label="크게 보기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-4-4"/></svg><span class="hide-sm">크게 보기</span>
  </button>
  <a class="btn primary" id="pdfBtn" download hidden aria-label="PDF 내려받기" title="PDF 내려받기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="hide-sm">PDF 내려받기</span>
  </a>
</header>

<main class="stage" id="stage">
  <div class="loading" id="loading">책을 펼치는 중…</div>
  <div class="book-wrap"><div id="book"></div></div>
</main>

<footer class="foot">
  <button class="btn icon-only" id="prev" aria-label="이전 쪽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
  <input type="range" class="scrub" id="scrub" min="0" value="0" aria-label="쪽 이동">
  <span class="where" id="where"></span>
  <button class="btn icon-only" id="next" aria-label="다음 쪽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
</footer>

<div class="scrim" id="scrim"></div>
<nav class="toc" id="toc" aria-label="목차">
  <header><h2>목차</h2>
    <button class="btn icon-only" id="tocClose" aria-label="목차 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <ol id="tocList"></ol>
</nav>

<div class="zoom" id="zoom" role="dialog" aria-label="크게 보기">
  <div class="bar">
    <div class="title"><h1 id="zoomTitle">크게 보기</h1></div>
    <button class="btn icon-only" id="zOut" aria-label="작게"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 12h12"/></svg></button>
    <button class="btn icon-only" id="zIn" aria-label="크게"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6v12M6 12h12"/></svg></button>
    <button class="btn" id="zClose">닫기</button>
  </div>
  <div class="zoom-body"><div class="zoom-pages" id="zoomPages"></div></div>
</div>

const TOC = [                     // [제목, 이동할 장(1부터), 하위 항목 여부, 표시할 쪽번호(생략 가능)]
  ["표지", 1],
  ["목차", 5],
  ["프롤로그", 6],
  ["참여자 및 프로젝트 소개", 17, false, 14],
  ["다원예술 창작산실", 19, true],
  ["다원예술 창작주체", 55, true],
  ["다원예술, 다섯 가지 물음과 대화", 65, false, 62],
  ["프로젝트 핵심 요소", 69, true],
  ["기술과 실험의 가능성", 77, true],
  ["다원예술의 가치와 정의", 87, true],
  ["정책과 지원, 확산의 조건", 99, true],
  ["미래 다원예술씬 상상하기", 107, true],
  ["2025 다원예술 키워드 모음", 118],
  ["뒤표지", PAGES.length]
];
/* ============================================================= */

const $ = id => document.getElementById(id);
const N = PAGES.length;
const book = $("book");
const imgs = [];
PAGES.forEach((src, i) => {
  const d = document.createElement("div");
  d.className = "page";
  if (i === 0 || i === N - 1) d.dataset.density = "hard";
  const im = document.createElement("img");
  im.alt = typeof LABELS[i] === "number" ? LABELS[i] + "쪽" : LABELS[i];
  im.decoding = "async";
  d.appendChild(im); book.appendChild(d); imgs.push(im);
});

function loadAround(i){
  for (let k = Math.max(0, i - 3); k <= Math.min(N - 1, i + 5); k++){
    if (!imgs[k].src) imgs[k].src = PAGES[k];
  }
}
loadAround(0);

function isTall(){ return window.innerHeight > window.innerWidth; }
const pf = new St.PageFlip(book, {
  width: 420, height: 600, size: "stretch",
  minWidth: isTall() ? 260 : 110, maxWidth: 900, minHeight: 370, maxHeight: 1290,
  showCover: true, usePortrait: true, mobileScrollSupport: false,
  maxShadowOpacity: 0.3, flippingTime: 650, drawShadow: true
});
pf.loadFromHTML(document.querySelectorAll(".page"));
$("loading").remove();

const scrub = $("scrub");
scrub.max = N - 1;

function label(i){ const l = LABELS[i]; return typeof l === "number" ? l + "쪽" : l; }
function visible(){
  const i = pf.getCurrentPageIndex();
  if (pf.getOrientation() === "portrait" || i === 0 || i === N - 1) return [i];
  const L = i % 2 === 1 ? i : i - 1;
  return [L, L + 1].filter(k => k >= 0 && k < N);
}
function update(){
  const i = pf.getCurrentPageIndex();
  loadAround(i);
  scrub.value = i;
  const v = visible();
  const txt = v.map(label).join(" – ").replace(/쪽 – (\d+)쪽/, "–$1쪽");
  $("where").innerHTML = "<b>" + txt + "</b>";
  let on = -1;
  TOC.forEach((t, k) => { if (t[1] - 1 <= v[v.length - 1]) on = k; });
  document.querySelectorAll("#tocList li").forEach((li, k) => li.classList.toggle("on", k === on));
}
pf.on("flip", update);
pf.on("changeOrientation", update);
/* 세로 화면은 한 쪽, 가로 화면은 양면 */
let lastTall = isTall();
window.addEventListener("resize", () => {
  const tall = isTall();
  if (tall === lastTall) return;
  lastTall = tall;
  pf.getSettings().minWidth = tall ? 260 : 110;
  setTimeout(() => { pf.update(); update(); }, 60);
});
update();

$("prev").onclick = () => pf.flipPrev();
$("next").onclick = () => pf.flipNext();
scrub.addEventListener("input", () => loadAround(+scrub.value));
scrub.addEventListener("change", () => { pf.turnToPage(+scrub.value); update(); });
document.addEventListener("keydown", e => {
  if (document.body.classList.contains("zoom-open")) { if (e.key === "Escape") closeZoom(); return; }
  if (e.key === "Escape") closeToc();
  if (e.target === scrub) return;
  if (e.key === "ArrowRight") pf.flipNext();
  if (e.key === "ArrowLeft") pf.flipPrev();
});

/* 목차 */
const list = $("tocList");
TOC.forEach(([t, p, sub, shown]) => {
  const li = document.createElement("li"); if (sub) li.className = "sub";
  const b = document.createElement("button");
  const l = shown || LABELS[p - 1];
  b.innerHTML = "<span></span><span class='pg'>" + (typeof l === "number" ? l : "") + "</span>";
  b.firstChild.textContent = t;
  b.onclick = () => { loadAround(p - 1); pf.turnToPage(p - 1); update(); closeToc(); };
  li.appendChild(b); list.appendChild(li);
});
function openToc(){ document.body.classList.add("toc-open"); $("tocBtn").setAttribute("aria-expanded","true"); }
function closeToc(){ document.body.classList.remove("toc-open"); $("tocBtn").setAttribute("aria-expanded","false"); }
$("tocBtn").onclick = openToc; $("tocClose").onclick = closeToc; $("scrim").onclick = closeToc;

/* 크게 보기 */
let zw = 0;
function openZoom(){
  const v = visible();
  const box = $("zoomPages"); box.innerHTML = "";
  const avail = window.innerWidth - 40;
  zw = Math.min(1200, Math.floor((avail - (v.length - 1) * 4) / v.length));
  if (window.innerWidth < 700) zw = avail;
  v.forEach(k => { const im = new Image(); im.src = PAGES[k]; im.alt = label(k); box.appendChild(im); });
  box.style.setProperty("--zw", zw);
  $("zoomTitle").textContent = v.map(label).join(" – ");
  document.body.classList.add("zoom-open");
}
function closeZoom(){ document.body.classList.remove("zoom-open"); }
function setZ(f){ zw = Math.max(200, Math.min(2000, Math.round(zw * f))); $("zoomPages").style.setProperty("--zw", zw); }
$("zoomBtn").onclick = openZoom; $("zClose").onclick = closeZoom;
$("zIn").onclick = () => setZ(1.25); $("zOut").onclick = () => setZ(0.8);

/* PDF 내려받기 */
if (PDF_URL) { const a = $("pdfBtn"); a.href = PDF_URL; a.download = PDF_NAME; a.hidden = false; }
</script>
